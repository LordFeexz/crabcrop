version: '3.8'

services:
  crabcrop:
    build: .
    image: crabcrop:latest
    container_name: crabcrop
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    environment:
      - PORT=${PORT:-3005}
      - RUST_LOG=crabcrop=info,tower_http=info
      # AWS Settings (Uncomment if using S3 cache/source fetching logic)
      # - AWS_ACCESS_KEY_ID=your_key
      # - AWS_SECRET_ACCESS_KEY=your_secret
      # - AWS_REGION=us-east-1
    volumes:
      - crabcrop-cache:/app/.cache/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3005}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  crabcrop-cache:
